[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "focus-crawler"
version = "0.1.0"
description = "配置驱动的个人自用聚焦爬虫（Windows 桌面工具）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "parsel>=1.9",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
media = ["pillow>=10"]
gui = ["PySide6>=6.6"]
dynamic = ["playwright>=1.40"]
# 通用站点解析：任意站点视频/音频（可选）
ytdlp = ["yt-dlp>=2024.1.1"]
dev = ["pytest>=8"]

[project.scripts]
focus-crawler = "focus_crawler.__main__:main"
focus-crawler-gui = "focus_crawler.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "real_ytdlp: 允许访问真实 yt-dlp（离线测试默认禁用）",
]
